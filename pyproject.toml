[project]
name = "adaptive-behaviour"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy==1.26.4",
  "pandas==2.3.3",
  "scipy==1.15.3",
  "matplotlib==3.10.9",
  "seaborn==0.13.2",
  "gym==0.26.2",
  "dill==0.4.1",
  "ipykernel==7.3.0",
  "statsmodels==0.14.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adaptive_behaviour"]
